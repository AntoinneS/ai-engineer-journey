[project]
name = "ai-engineer-journey"
version = "0.1.0"
description = "Applied AI engineering, built in public: LLM APIs, structured output, RAG, agents, and evals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.1.4",
]

[project.scripts]
ai-engineer-journey = "ai_engineer_journey:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
